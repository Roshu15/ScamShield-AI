<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ScamShield AI</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            white-space: pre-wrap;
        }

    </style>

</head>


<body>

    <h1>ScamShield AI</h1>

    <p>
        Paste a suspicious message below and let ScamShield AI analyze it.
    </p>

    <textarea
        id="message"
        placeholder="Example: You won ₹50,000. Click this link immediately...">
    </textarea>

    <br>

    <button onclick="analyzeMessage()">
        Analyze Message
    </button>

    <div id="result">
        Result will appear here...
    </div>


    <script>

        async function analyzeMessage() {

            const message =
                document.getElementById("message").value;

            const result =
                document.getElementById("result");

            if (!message.trim()) {

                result.innerText =
                    "Please enter a message.";

                return;
            }

            result.innerText = "Analyzing...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );

                const data = await response.json();

                result.innerText = data.response;

            }

            catch (error) {

                result.innerText =
                    "Could not connect to ScamShield AI API.";

                console.error(error);

            }

        }

    </script>

</body>

</html>
